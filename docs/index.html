  <script type="text/markdown">
    <a id="atlas-privacy"></a>

    ## How respondents are protected

    Every lab picks one of three consent levels in the survey, and the public view applies two rules on top of them.

    - **Named** (${d3.format(",")(consentCounts.get("named") ?? 0)} labs): name shown with systems and announced plans.
    - **Unnamed** (${d3.format(",")(consentCounts.get("unnamed") ?? 0)} labs): systems and plans shown as, say, "a community hospital in Germany". Where a country has fewer than ${MIN_CELL} responding labs, only the region is given.
    - **Totals only** (${d3.format(",")(consentCounts.get("aggregate") ?? 0)} labs): counted in maps, charts, and totals, but never listed individually.
    - **Plans:** a listed lab's new vendor, go-live date, reason, and decision-maker appear only once the lab says they're announced or under contract. "Evaluating" is only ever counted in totals, and so are each lab's long-term direction and informatics team size.
    - **Small-cell suppression:** any number based on fewer than ${MIN_CELL} labs is hidden. Map areas are hatched, and counts read "fewer than ${MIN_CELL}". ${publicView ? "On the vendor map, that currently hides " + hatchedCountries + " countries." : "The staff view switches this off."}

    Switch **Show as** to *Staff view* at the top of the page to see the raw data these rules protect. In the live atlas, that view would sit behind a staff login.
  </script>
  <script type="text/markdown">
    ## From prototype to live

    - **Survey.** Any form tool that exports CSV or has an API works (REDCap, Qualtrics, Google Forms). The referral link is a URL parameter (`?ref=CODE`) stored with each response.
    - **Data.** A scheduled data loader pulls the responses, removes names for labs that opted out, and publishes one cleaned CSV. The charts on this page read that file instead of the synthetic generator built into this notebook.
    - **Governance.** The Association owns the dataset. A small editorial group reviews new vendors and merges duplicates, and an open license lets members reuse the data.
  </script>

  <script type="module">
    const vendorGroup = (v) => (TRACKED.includes(v) ? v : OTHER);
    const vendorColor = (v) => (v === UNDECIDED ? UNDECIDED_COLOR : GROUP_COLORS[GROUPS.indexOf(vendorGroup(v))]);
    const pct = (a, b) => (b ? d3.format(".0%")(a / b) : "—");
    const quarterLabel = (date) => `Q${Math.floor(date.getUTCMonth() / 3) + 1} ${date.getUTCFullYear()}`;
    const articleFor = (s) => (/^[aeiou]/i.test(s) ? "An" : "A");
    const hatchId = () => `hatch-${Math.random().toString(36).slice(2, 9)}`;

    // A diagonal hatch for map areas hidden by small-cell suppression.
    function hatchDefs(id) {
      return () => svg`<defs><pattern id=${id} width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#ecebe6"></rect><line x1="1" y1="0" x2="1" y2="6" stroke="#b9b7ae" stroke-width="2"></line></pattern></defs>`;
    }

    function swatchLegend(items) {
      return html`<div class="swatches">${items.map(([label, fill]) => html`<span><i style="border-radius: 2px; background: ${fill};"></i>${label}</span>`)}</div>`;

          titleEl.textContent = title;

            const row = document.createElement("div");
            row.className = "tip-row";
            if (color) {
              const key = document.createElement("span");
              key.className = "tip-key";
              key.style.background = color;

            }

            strong.textContent = value;

          const x = event.clientX - box.left;
          const y = event.clientY - box.top;
          const flip = x > box.width - 320;

      const [[x0, y0], [x1, y1]] = extent;
      return {type: "equal-earth", domain: {type: "MultiPoint", coordinates: [[x0, y0], [x1, y0], [x0, y1], [x1, y1], [(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1]]}, inset: 4};

    function regionOf(feature) {
      const known = COUNTRY_BY_ID.get(feature.id);

    }

  <script type="module">
    const seedResponses = (() => {
      const random = d3.randomLcg(20261007);
      const consentRandom = d3.randomLcg(1729);
      const announceRandom = d3.randomLcg(4242);
      const decideRandom = d3.randomLcg(8128);
      const teamRandom = d3.randomLcg(2718);
      const directionRandom = d3.randomLcg(31337);
      const pick = (weights, rng = random) => {
        const entries = Object.entries(weights);
        let r = rng() * d3.sum(entries, ([, w]) => w);
        for (const [key, w] of entries) if ((r -= w) < 0) return key;
        return entries[entries.length - 1][0];
      };
      const pickExcept = (weights, except) => {
        for (let i = 0; i < 12; ++i) {
          const v = pick(weights);
          if (v !== except) return v;
        }
        return except === "Other commercial" ? "Bespoke (in-house)" : "Other commercial";
      };
      const pickWeighted = (array, weight) => {
        let r = random() * d3.sum(array, weight);
        for (const x of array) if ((r -= weight(x)) < 0) return x;
        return array[array.length - 1];
      };
      const choice = (array) => array[Math.floor(random() * array.length)];
      const between = (a, b, skew = 1) => new Date(+a + (b - a) * random() ** skew);
      const used = new Set();
      const placeName = () => {
        for (;;) {
          const p = choice(STEMS_A) + choice(STEMS_B);
          if (!used.has(p)) return used.add(p), p;
        }
      };

      const rows = [];
      let serial = 0;
      for (const [countryId, country, region, n, profile] of COUNTRIES) {
        for (let i = 0; i < n; ++i) {
          const board = i < (BOARD_QUOTA[countryId] ?? 0);
          const type = board ? "Academic medical center" : pick(TYPE_MIX);
          const cp = pick(PROFILES[profile]);
          const lis = {
            cp,
            ap: random() < 0.55 ? cp : pick(AP_PROFILES[profile] ?? PROFILES[profile]),
            micro: random() < 0.85 ? cp : pick(PROFILES[profile]),
            bb: random() < 0.6 ? cp : pick(PROFILES[profile])
          };
          const switching = random() < Math.min(0.85, 0.36 * (PROPENSITY[cp] ?? 1));
          const status = switching ? pick({Evaluating: 35, Selected: 22, Implementing: 43}) : "Stable";
          const committed = status === "Selected" || status === "Implementing";
          const newVendor = committed ? pickExcept(TARGETS[profile], cp) : null;
          let goLive = null;
          if (committed) {
            const year = +pick(status === "Implementing" ? {2026: 14, 2027: 56, 2028: 30} : {2027: 18, 2028: 47, 2029: 27, 2030: 8});
            const quarter = year === 2026 ? 4 : 1 + Math.floor(random() * 4);
            goLive = utc(year, quarter * 3 - 2, 1);
          }
          const reason = switching ? pick(newVendor === "Sirius Cybernetics" ? REASONS_TO_SIRIUS : REASONS_OTHER) : null;
          const decider = reason ? pick(DECIDER_MIX[reason] ?? DECIDER_MIX.other, decideRandom) : null;
          const informatics = pick(TEAM_MIX[type], teamRandom);
          const direction = pick(DIRECTION_MIX[informatics], directionRandom);
          const previous = !switching && random() < (cp === "Sirius Cybernetics" ? 0.34 : 0.07)
            ? {vendor: pickExcept(PROFILES[profile], cp), date: between(utc(2021, 6, 1), utc(2026, 9, 1))}
            : null;
          const showName = board || random() < 0.68;
          const place = placeName();
          const name = type === "Academic medical center" && LOCAL_AMC[countryId] ? LOCAL_AMC[countryId](place) : choice(NAME_PATTERNS[type])(place);
          rows.push({
            id: `L${String(++serial).padStart(3, "0")}`,
            name,
            consent: showName ? "named" : consentRandom() < 0.6 ? "unnamed" : "aggregate",
            plansPublic: committed && announceRandom() < (status === "Implementing" ? 0.85 : 0.5),
            country, countryId, region, profile, type, lis, status, newVendor, goLive, reason, decider, informatics, direction, previous, board
          });
        }
      }

      // When each lab answered, by rollout phase.
      for (const d of rows) {
        if (d.board) {
          d.wave = "Board";
          d.submitted = between(utc(2026, 8, 3), utc(2026, 8, 6));
          continue;
        }
        d.wave = pick(WAVE_MIX[REACH[d.profile]]);
        const phase = PHASES.find((p) => p.name === d.wave);
        d.submitted = between(d.wave === "Pilot" ? utc(2026, 8, 6) : phase.start, phase.end, d.wave === "LinkedIn wave" ? 1.6 : 1.1);
      }
      rows.sort((a, b) => a.submitted - b.submitted);

      // Who referred whom: mostly a colleague in the same country who answered recently (their referral link is fresh),
      // with a pull toward labs that already referred others.
      const RICH = 1.2, BOARD_PULL = 0.6, FRESH_DAYS = 10;
      const boardRows = rows.filter((d) => d.board);
      for (const d of boardRows) Object.assign(d, {referrer: null, degree: 0, children: 0});
      const done = [...boardRows];
      for (const d of rows) {
        if (d.board) continue;
        let pool;
        if (d.wave === "Pilot") {
          pool = boardRows.filter((b) => b.countryId === d.countryId);
          if (!pool.length) pool = boardRows;
        } else {
          const r = random();
          pool = r < 0.55 ? done.filter((x) => x.countryId === d.countryId) : r < 0.8 ? done.filter((x) => x.region === d.region) : done;
          if (!pool.length) pool = done.filter((x) => x.region === d.region);
          if (!pool.length) pool = done;
        }
        const ref = d.wave === "Pilot"
          ? pickWeighted(pool, (x) => 1 + x.children)
          : pickWeighted(pool, (x) => (1 + RICH * x.children) * (x.board ? BOARD_PULL : 1) * Math.exp(-(d.submitted - x.submitted) / (FRESH_DAYS * 864e5)));
        Object.assign(d, {referrer: ref.id, degree: ref.degree + 1, children: 0});
        ref.children += 1;
        done.push(d);
      }
      return rows;
    })();

  <script type="module">
    function countryStats(rows, disc) {
      const stats = new Map();
      for (const [id, list] of d3.group(rows, (d) => d.countryId)) {
        const counts = d3.rollups(list, (v) => v.length, (d) => d.lis[disc]).sort((a, b) => d3.descending(a[1], b[1]));
        stats.set(id, {n: list.length, counts, share: (vendor) => (counts.find(([k]) => k === vendor)?.[1] ?? 0) / list.length});
      }
      return stats;
    }

    function vendorMap(rows, disc, region) {
      const stats = countryStats(rows, disc);
      // Small-cell suppression: color a country only when its leading vendor has at least MIN_CELL labs.
      const hidden = (f) => suppressed(stats.get(f.id).counts[0][1]);
      const describe = (f, i) => {
        const s = stats.get(f.id);
        const c = s.counts[i];
        return !c ? "—" : suppressed(c[1]) ? `hidden (fewer than ${MIN_CELL} labs)` : `${c[0]} (${pct(c[1], s.n)})`;
      };
      const id = hatchId();
      const plot = Plot.plot({
        width: mapWidth(region),
        style: PLOT_STYLE,
        projection: projectionFor(region),
        color: {type: "ordinal", domain: GROUPS, range: GROUP_COLORS},

          Plot.geo(countryFeatures.filter((f) => !stats.has(f.id)), Plot.centroid({
            fill: BLANK,
            tip: {format: {x: false, y: false}},
            channels: {Country: (f) => f.properties.name, Status: () => "No responses yet"}
          })),
          Plot.geo(countryFeatures.filter((f) => stats.has(f.id) && hidden(f)), Plot.centroid({
            fill: `url(#${id})`,
            tip: {format: {x: false, y: false}},
            channels: {
              Country: (f) => f.properties.name,
              "Labs responding": (f) => fmtCount(stats.get(f.id).n),
              Status: () => `Hidden: no vendor here has ${MIN_CELL} or more labs`
            }
          })),
          Plot.geo(countryFeatures.filter((f) => stats.has(f.id) && !hidden(f)), Plot.centroid({
            fill: (f) => vendorGroup(stats.get(f.id).counts[0][0]),
            tip: {format: {x: false, y: false, fill: false}},
            channels: {
              Country: (f) => f.properties.name,
              "Labs responding": (f) => stats.get(f.id).n,
              "Most common": (f) => describe(f, 0),
              "Runner-up": (f) => describe(f, 1)
            }
          })),
          Plot.geo(borders, {stroke: "white", strokeWidth: 0.6})
        ]
      });
      return html`<div>${swatchLegend([
        ...GROUPS.map((group, i) => [group, GROUP_COLORS[i]]),
        ...(publicView ? [[`Hidden (fewer than ${MIN_CELL} labs)`, HATCH_CSS]] : []),
        ["No responses yet", BLANK]
      ])}${plot}</div>`;
    }

    function vendorSmallMultiples(rows, disc, region) {
      if (!rows.length) return emptyNote();
      const stats = countryStats(rows, disc);
      const covered = countryFeatures.filter((f) => stats.has(f.id));
      const cols = W >= 720 ? 3 : W >= 440 ? 2 : 1;
      const gap = 18;

      const color = {type: "linear", domain: [0, 1], interpolate: d3.interpolateRgbBasis(SHARE_RAMP), tickFormat: "%", label: "Share of responding labs in the country"};
      const maps = MULTIPLE_VENDORS.map((vendor) => {
        const id = hatchId();
        const count = (f) => stats.get(f.id).counts.find(([k]) => k === vendor)?.[1] ?? 0;
        // Hide a country when it has too few labs overall, or too few on this vendor.
        const hidden = (f) => suppressed(stats.get(f.id).n) || (count(f) > 0 && suppressed(count(f)));
        return html`<div>
          <div style="font: 600 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: ${INK};">${vendor}</div>
          ${Plot.plot({
            width: w,

              Plot.geo(land, {fill: BLANK}),
              Plot.geo(covered.filter((f) => !hidden(f)), Plot.centroid({
                fill: (f) => stats.get(f.id).share(vendor),
                tip: {format: {x: false, y: false, fill: false}},
                channels: {Country: (f) => f.properties.name, [`On ${vendor}`]: (f) => pct(stats.get(f.id).share(vendor), 1), "Labs responding": (f) => stats.get(f.id).n}
              })),
              Plot.geo(covered.filter((f) => hidden(f)), Plot.centroid({
                fill: `url(#${id})`,
                tip: {format: {x: false, y: false}},

              })),
              Plot.geo(borders, {stroke: "white", strokeWidth: 0.4})

          })}
        </div>`;
      });
      return html`<div>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 24px;">${Plot.legend({color: {...color, width: 300}, style: PLOT_STYLE})}${publicView ? swatchLegend([[`Hidden (fewer than ${MIN_CELL} labs)`, HATCH_CSS]]) : ""}</div>

  <script type="module">
    function migrationSankey(rows, disc) {
      const movers = rows.filter((d) => d.status !== "Stable");
      if (!movers.length) return emptyNote();
      const flows = d3.rollups(movers, (v) => v.length, (d) => d.lis[disc], (d) => d.newVendor ?? UNDECIDED);
      const allLinks = flows.flatMap(([from, tos]) => tos.map(([to, value]) => ({source: `from:${from}`, target: `to:${to}`, value})));
      // Small-cell suppression: leave out moves made by fewer than MIN_CELL labs in the public view.
      const links = allLinks.filter((l) => !suppressed(l.value));
      const hiddenLabs = d3.sum(allLinks, (l) => (suppressed(l.value) ? l.value : 0));
      if (!links.length) return html`<p class="empty-note">Every move in this view involves fewer than ${MIN_CELL} labs, so none are shown.</p>`;
      const ids = [...new Set(links.flatMap((l) => [l.source, l.target]))];
      const nodes = ids.map((id) => ({id, name: id.slice(id.indexOf(":") + 1), side: id.startsWith("from:") ? "from" : "to"}));
      const tallest = Math.max(...["from", "to"].map((side) => nodes.filter((n) => n.side === side).length));
      const w = W;
      const h = Math.max(340, tallest * 40 + 28);
      const marginL = 170;
      const marginR = 200;
      const graph = d3Sankey()
        .nodeId((d) => d.id)
        .nodeWidth(12)
        .nodePadding(14)
        .nodeSort((a, b) => (a.name === UNDECIDED) - (b.name === UNDECIDED) || b.value - a.value)
        .extent([[marginL, 28], [w - marginR, h - 8]])({nodes, links});

      const wrap = html`<div class="viz-wrap"></div>`;
      const tip = tooltip(wrap);
      const svg = d3.create("svg").attr("width", w).attr("height", h).attr("viewBox", [0, 0, w, h]).style("max-width", "100%").style("height", "auto").style("font", "12.5px system-ui, -apple-system, 'Segoe UI', sans-serif");
      const path = d3.linkHorizontal().source((d) => [d.source.x1, d.y0]).target((d) => [d.target.x0, d.y1]);
      const link = svg.append("g").attr("fill", "none").selectAll("path").data(graph.links).join("path")
        .attr("d", path)
        .attr("stroke", (d) => vendorColor(d.target.name))
        .attr("stroke-opacity", 0.45)
        .attr("stroke-width", (d) => Math.max(1.5, d.width))
        .on("pointermove", function (event, d) {
          link.attr("stroke-opacity", (l) => (l === d ? 0.85 : 0.18));
          tip.show(event, `${d.source.name} → ${d.target.name}`, [[`${d.value}`, d.value === 1 ? "lab" : "labs", vendorColor(d.target.name)], [pct(d.value, d.source.value), `of labs leaving ${d.source.name}`]]);
        })
        .on("pointerleave", () => {
          link.attr("stroke-opacity", 0.45);
          tip.hide();
        });
      svg.append("g").selectAll("rect").data(graph.nodes).join("rect")
        .attr("x", (d) => d.x0)
        .attr("y", (d) => d.y0)
        .attr("width", (d) => d.x1 - d.x0)
        .attr("height", (d) => Math.max(1, d.y1 - d.y0))
        .attr("rx", 2)
        .attr("fill", (d) => vendorColor(d.name));
      const label = svg.append("g").selectAll("text").data(graph.nodes).join("text")
        .attr("x", (d) => (d.side === "from" ? d.x0 - 8 : d.x1 + 8))
        .attr("y", (d) => (d.y0 + d.y1) / 2)
        .attr("dy", "0.35em")
        .attr("text-anchor", (d) => (d.side === "from" ? "end" : "start"));
      label.append("tspan").attr("fill", INK).text((d) => d.name);
      label.append("tspan").attr("fill", MUTED).text((d) => `  ${d.value}`);
      svg.append("g").attr("fill", INK2).style("font-weight", 600).style("letter-spacing", "0.05em").selectAll("text")
        .data([["RUNS TODAY", marginL, "start"], ["MOVING TO", w - marginR, "end"]]).join("text")
        .attr("x", (d) => d[1]).attr("y", 12).attr("text-anchor", (d) => d[2]).text((d) => d[0]);
      wrap.append(svg.node());
      if (hiddenLabs) wrap.append(html`<p class="viz-note">${hiddenLabs} more labs are in moves made by fewer than ${MIN_CELL} labs each, which the public view leaves out.</p>`);
      return wrap;
    }
  </script>

          Plot.text(data, {x: (d) => (d.hidden ? 0 : d.share), y: "team", text: (d) => (d.hidden ? `fewer than ${MIN_CELL}` : `${pct(d.n, d.total)} of ${d.total} labs`), dx: 6, textAnchor: "start", fill: (d) => (d.hidden ? MUTED : INK2)}),

    function shareOverTime(rows, disc) {

      const dates = [...d3.range(2021, 2026).map((y) => utc(y, 12, 31)), TODAY, ...d3.range(2026, 2031).map((y) => utc(y, 12, 31))];

  <script type="module">
    const networkLayout = (() => {
      const children = d3.rollup(responses, (v) => v.length, (d) => d.referrer);
      const hub = {id: "ASSOC", d: null, children: board.length, r: 9};
      const nodes = [hub, ...responses.map((d) => ({id: d.id, d, children: children.get(d.id) ?? 0, r: 2.4 + Math.sqrt(children.get(d.id) ?? 0) * 1.5}))];
      const links = [
        ...board.map((b) => ({source: "ASSOC", target: b.id, hub: true})),
        ...responses.filter((d) => d.referrer).map((d) => ({source: d.referrer, target: d.id}))
      ];
      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.hub ? 34 : 9)).strength((l) => (l.hub ? 0.6 : 1)))
        .force("charge", d3.forceManyBody().strength(-12))
        .force("x", d3.forceX().strength(0.03))
        .force("y", d3.forceY().strength(0.045))
        .force("collide", d3.forceCollide((d) => d.r + 0.8))
        .stop();
      for (let i = 0; i < 360; ++i) simulation.tick();
      return {nodes, links, byId: new Map(nodes.map((n) => [n.id, n]))};
    })();
    const networkStats = (() => {
      const degrees = filtered.map((d) => d.degree);
      return {n: degrees.length, median: d3.median(degrees) ?? 0, max: d3.max(degrees) ?? 0, withinSix: degrees.filter((k) => k <= 6).length};
    })();

  <script type="module">
    function referralNetwork({nodes, links, byId}, visible) {
      const w = W;
      const h = Math.round(Math.min(640, Math.max(420, w * 0.6)));
      const [x0, x1] = d3.extent(nodes, (n) => n.x);
      const [y0, y1] = d3.extent(nodes, (n) => n.y);
      const k = Math.min((w - 60) / (x1 - x0 || 1), (h - 60) / (y1 - y0 || 1));
      const sx = (x) => w / 2 + (x - (x0 + x1) / 2) * k;
      const sy = (y) => h / 2 + (y - (y0 + y1) / 2) * k;
      const rOf = (n) => Math.max(2.2, n.r * Math.min(k, 1.6));
      const isVisible = (n) => !n.d || visible.has(n.id);
      const fillOf = (n) => (n.d ? DEGREE_COLORS[degreeBin(n.d.degree)] : INK);
      const chainOf = (n) => {
        const chain = [];
        for (let cur = n; cur; cur = cur.d?.referrer ? byId.get(cur.d.referrer) : cur.d ? byId.get("ASSOC") : null) chain.push(cur);
        return chain;
      };

      const wrap = html`<div class="viz-wrap"></div>`;
      const tip = tooltip(wrap);
      const svg = d3.create("svg").attr("width", w).attr("height", h).attr("viewBox", [0, 0, w, h]).style("max-width", "100%").style("height", "auto").style("font", "12px system-ui, -apple-system, 'Segoe UI', sans-serif");
      const link = svg.append("g").attr("stroke", AXIS).attr("stroke-width", 0.8).selectAll("line").data(links).join("line")
        .attr("x1", (l) => sx(l.source.x)).attr("y1", (l) => sy(l.source.y))
        .attr("x2", (l) => sx(l.target.x)).attr("y2", (l) => sy(l.target.y))
        .attr("stroke-opacity", (l) => (visible.has(l.target.id) ? 0.9 : 0.25));
      const node = svg.append("g").selectAll("circle").data(nodes).join("circle")
        .attr("cx", (n) => sx(n.x)).attr("cy", (n) => sy(n.y)).attr("r", rOf)
        .attr("fill", fillOf)
        .attr("stroke", (n) => (n.d?.board ? INK : SURFACE))
        .attr("stroke-width", (n) => (n.d?.board ? 1.5 : 0.8))
        .attr("opacity", (n) => (isVisible(n) ? 1 : 0.15));
      const hub = byId.get("ASSOC");
      const labelled = [hub, ...nodes.filter((n) => n.d && visible.has(n.id) && (!publicView || n.d.consent === "named") && !n.d.board).sort((a, b) => b.children - a.children).slice(0, 3)];
      svg.append("g").selectAll("text").data(labelled).join("text")
        .attr("x", (n) => sx(n.x) + rOf(n) + 4).attr("y", (n) => sy(n.y)).attr("dy", "0.35em")
        .attr("fill", INK).attr("stroke", SURFACE).attr("stroke-width", 3).attr("paint-order", "stroke")
        .style("font-weight", (n) => (n.d ? 400 : 700))
        .text((n) => (n.d ? n.d.name : "The Association"));

      // Nearest-node hover, so small dots are easy to hit.
      const delaunay = d3.Delaunay.from(nodes, (n) => sx(n.x), (n) => sy(n.y));
      svg.on("pointermove", (event) => {
        const [mx, my] = d3.pointer(event);
        const n = nodes[delaunay.find(mx, my)];
        if (!n || Math.hypot(sx(n.x) - mx, sy(n.y) - my) > 24) return reset();
        const chain = chainOf(n);
        const onChain = new Set(chain.map((c) => c.id));
        node.attr("opacity", (m) => (onChain.has(m.id) ? 1 : 0.12));
        link.attr("stroke-opacity", (l) => (onChain.has(l.target.id) && onChain.has(l.source.id) ? 1 : 0.08)).attr("stroke", (l) => (onChain.has(l.target.id) && onChain.has(l.source.id) ? INK : AXIS));
        if (!n.d) return tip.show(event, "The Association", [[`${board.length}`, "board members seeded the survey"]]);
        // The referral chain from the board down to this lab, shortened in the middle when long.
        const stepLabel = (d) => `${labelOf(d)}${!publicView || d.consent === "named" ? `, ${d.country}` : ""}${d.board ? " (board)" : ""}`;
        const steps = chain.slice().reverse().filter((c) => c.d).map((c, i) => [`${i}`, stepLabel(c.d)]);
        const shown = steps.length > 6 ? [...steps.slice(0, 2), ["…", `${steps.length - 4} more labs`], ...steps.slice(-2)] : steps;
        tip.show(event, labelOf(n.d), [
          [`${n.d.degree}`, n.d.degree === 1 ? "hop from the board" : "hops from the board", fillOf(n)],
          [`${n.children}`, n.children === 1 ? "lab referred" : "labs referred"],
          ...(steps.length > 1 ? [["", "Referral chain:"], ...shown.slice(0, -1)] : [])
        ]);
      });
      const reset = () => {
        node.attr("opacity", (n) => (isVisible(n) ? 1 : 0.15));
        link.attr("stroke-opacity", (l) => (visible.has(l.target.id) ? 0.9 : 0.25)).attr("stroke", AXIS);
        tip.hide();
      };
      svg.on("pointerleave", reset);
      wrap.append(html`<div class="swatches">${DEGREE_LABELS.map((label, i) => html`<span><i style="background:${DEGREE_COLORS[i]}${i === 0 ? `; box-shadow: 0 0 0 1.5px ${INK}` : ""}"></i>${label}</span>`)}</div>`, svg.node());
      return wrap;
    }

    function degreeHistogram(rows) {
      if (!rows.length) return emptyNote();
      const counts = d3.rollup(rows, (v) => v.length, (d) => d.degree);
      const data = d3.range(0, d3.max(counts.keys()) + 1).map((k) => ({k, n: counts.get(k) ?? 0}));
      return Plot.plot({
        width: Math.min(W, 460),
        height: 210,
        marginTop: 20,
        style: PLOT_STYLE,
        x: {domain: data.map((d) => d.k), label: "Hops from the board", labelAnchor: "center", labelArrow: "none", tickSize: 0, tickFormat: (k) => (k === 0 ? "Board" : k)},
        y: {axis: null},
        marks: [
          Plot.barY(data, {x: "k", y: "n", fill: (d) => DEGREE_COLORS[degreeBin(d.k)], insetLeft: 1, insetRight: 1, ry2: 3, tip: {format: {fill: false}}, channels: {Labs: "n"}}),
          Plot.text(data, {x: "k", y: "n", text: (d) => d.n, dy: -8, fill: INK2}),
          Plot.ruleY([0], {stroke: AXIS})
        ]
      });
    }

    function topConnectors(rows) {
      const children = d3.rollup(responses, (v) => v.length, (d) => d.referrer);
      const top = rows.filter((d) => !d.board && listable(d) && children.get(d.id)).sort((a, b) => children.get(b.id) - children.get(a.id)).slice(0, 6);
      if (!top.length) return emptyNote();
      return html`<ol class="leaders">${top.map((d) => html`<li><b>${children.get(d.id)}</b><div>${labelOf(d)}<br><span>${!publicView || d.consent === "named" ? `${d.country} · ` : ""}${d.degree} ${d.degree === 1 ? "hop" : "hops"} from the board</span></div></li>`)}</ol>`;
    }
  </script>
  <script type="module">
    const coverageCounts = d3.rollup(filtered, (v) => v.length, (d) => d.countryId);
    const blankSpots = countryFeatures
      .filter((f) => !coverageCounts.has(f.id) && (region === "All regions" || regionOf(f) === region))
      .map((f) => ({name: f.properties.name, pop: POP_M[f.id] ?? 0}))
      .sort((a, b) => d3.descending(a.pop, b.pop) || d3.ascending(a.name, b.name))
      .slice(0, 16);

    function coverageMap(rows, region) {
      const bins = publicView ? [COVERAGE_BINS[0], `Fewer than ${MIN_CELL}`, ...COVERAGE_BINS.slice(2)] : COVERAGE_BINS;
      const bin = (n) => (!n ? bins[0] : n < 5 ? bins[1] : n < 15 ? bins[2] : n < 50 ? bins[3] : bins[4]);
      return Plot.plot({
        width: mapWidth(region),
        style: PLOT_STYLE,
        projection: projectionFor(region),
        color: {type: "ordinal", domain: bins, range: COVERAGE_COLORS, legend: true},
        marks: [
          Plot.geo(countryFeatures, Plot.centroid({
            fill: (f) => bin(coverageCounts.get(f.id)),
            tip: {format: {x: false, y: false, fill: false}},
            channels: {
              Country: (f) => f.properties.name,
              Responses: (f) => {
                const n = coverageCounts.get(f.id) ?? 0;
                return n ? fmtCount(n) : "0";
              },
              Status: (f) => {
                const n = coverageCounts.get(f.id);
                return !n ? "Blank: ambassador wanted" : n < 5 ? "Thin: needs a second push" : "Covered";
              }
            }
          })),
          Plot.geo(borders, {stroke: "white", strokeWidth: 0.6})
        ]
      });
    }
  </script>
  <script type="module">
    function rolloutCurve(rows, metric) {
      const sorted = rows.slice().sort((a, b) => a.submitted - b.submitted);
      const days = d3.utcDays(utc(2026, 8, 3), utc(2026, 10, 8));
      const seen = new Set();
      let i = 0;
      const data = days.map((day) => {
        const end = d3.utcDay.offset(day, 1);
        while (i < sorted.length && sorted[i].submitted < end) seen.add(sorted[i++].countryId);
        return {date: day, value: metric === "responses" ? i : seen.size};
      });
      const label = metric === "responses" ? "Labs responding" : "Countries covered";
      const yMax = d3.max(data, (d) => d.value) * 1.12 || 1;
      return html`<div><b>${label}</b>${Plot.plot({
        width: Math.min(W / 2 - 20, 540) < 300 ? Math.min(W, 540) : Math.min(W / 2 - 20, 540),
        height: 250,
        marginTop: 26,
        style: PLOT_STYLE,
        x: {type: "utc", label: null, ticks: d3.utcWeek.every(2), tickFormat: "%b %-d"},
        y: {domain: [0, yMax], grid: true, label: null},
        marks: [
          Plot.rect(PHASES, {x1: "start", x2: "end", fill: (d, i) => (i % 2 ? "#f4f3ef" : "#ecebe6"), fillOpacity: 0.8}),
          Plot.text(PHASES, {x: (d) => new Date((+d.start + +d.end) / 2), frameAnchor: "top", dy: -16, text: "name", fill: INK2, fontWeight: 600}),
          Plot.lineY(data, {x: "date", y: "value", stroke: GROUP_COLORS[0], strokeWidth: 2}),
          Plot.ruleX(data, Plot.pointerX({x: "date", stroke: AXIS})),
          Plot.dot(data, Plot.pointerX({x: "date", y: "value", fill: GROUP_COLORS[0], r: 4, stroke: SURFACE, strokeWidth: 2})),
          Plot.tip(data, Plot.pointerX({x: "date", y: "value", title: (d) => `${d.value} ${label.toLowerCase()}\n${d3.utcFormat("%b %-d, %Y")(d.date)}`}))
        ]
      })}</div>`;
    }
  </script>
  <script type="module">
    function surveyForm() {
      const usa = countryFeatures.find((f) => f.id === "840");
      const inputs = {
        institution: Inputs.text({label: "Institution name", placeholder: "e.g., Larkmoor University Hospital", width: 320}),
        country: Inputs.select(countryFeatures, {label: "Country", format: (f) => f.properties.name, value: usa}),
        type: Inputs.select(TYPES, {label: "Institution type"}),
        informatics: Inputs.select(INFORMATICS_TEAMS, {label: "In-house informatics team", value: "3–10 people"}),
        ap: Inputs.select(VENDORS, {label: "Anatomic pathology", value: "Cassandra Health"}),
        cp: Inputs.select(VENDORS, {label: "Clinical pathology", value: "Magrathea Labs"}),
        micro: Inputs.select(VENDORS, {label: "Microbiology", value: "Magrathea Labs"}),
        bb: Inputs.select(VENDORS, {label: "Blood bank", value: "Magrathea Labs"}),
        direction: Inputs.select(DIRECTIONS, {label: "Where is your lab headed?", value: "LIS plus digital pathology add-ons"}),
        status: Inputs.radio(STATUSES, {label: "Switching status", value: "Implementing"}),
        newVendor: Inputs.select(VENDORS, {label: "New vendor", value: "Sirius Cybernetics"}),
        goLive: Inputs.select([2026, 2027, 2028, 2029, 2030], {label: "Go-live year", value: 2027, format: String}),
        announced: Inputs.radio(["yes", "no"], {label: "Are these plans public?", format: (k) => (k === "yes" ? "Yes: announced or under contract" : "Not yet: count them in totals only"), value: "yes"}),
        reason: Inputs.select(REASONS, {label: "Main reason"}),
        decider: Inputs.select(DECIDERS, {label: "Who decides"}),
        consent: Inputs.radio(CONSENT_LEVELS, {label: "How to show us", format: (k) => CONSENT_CHOICES[k], value: "named"})
      };
      const form = Inputs.form(inputs, {
        template: (i) => html`<div>
          <div class="survey-step"><span class="step-n">1</span><div><h4>Your lab</h4>${i.institution}${i.country}${i.type}${i.informatics}</div></div>
          <div class="survey-step"><span class="step-n">2</span><div><h4>Current LIS for each discipline</h4>${i.ap}${i.cp}${i.micro}${i.bb}</div></div>
          <div class="survey-step"><span class="step-n">3</span><div><h4>Plans</h4>${i.direction}${i.status}${i.newVendor}${i.goLive}${i.announced}${i.reason}${i.decider}</div></div>
          <div class="survey-step"><span class="step-n">4</span><div><h4>Visibility</h4>${i.consent}</div></div>
        </div>`
      });
      const sync = () => {
        const s = inputs.status.value;
        const committed = s === "Selected" || s === "Implementing";
        inputs.newVendor.style.display = inputs.goLive.style.display = inputs.announced.style.display = committed ? "" : "none";
        inputs.reason.style.display = inputs.decider.style.display = s === "Stable" ? "none" : "";
      };
      // Keep keystrokes in the form from re-running the charts; only Submit does that.
      form.addEventListener("input", (event) => {
        sync();
        event.stopPropagation();
      });
      sync();

      const message = html`<div aria-live="polite"></div>`;
      const button = html`<button class="survey-submit" type="button">Submit response</button>`;
      const container = html`<div class="survey">${form}<div class="survey-actions">${button}<span class="survey-time">About 2 minutes. Demo only: nothing leaves this page.</span></div>${message}</div>`;
      container.value = [];
      button.onclick = () => {
        const v = form.value;
        const name = v.institution.trim();
        if (!name) {
          message.replaceChildren(html`<p class="survey-error">Please enter your institution's name.</p>`);
          return;
        }
        const f = v.country;
        const country = COUNTRY_BY_ID.get(f.id)?.name ?? f.properties.name;
        const committed = v.status === "Selected" || v.status === "Implementing";
        // Simulate arriving through the busiest referrer nearby: same country, else same region.
        const nearby = (test) => seedResponses.filter((d) => !d.board && test(d));
        const local = nearby((d) => d.countryId === f.id);
        const regional = nearby((d) => d.region === regionOf(f));
        const ref = d3.greatest(local.length ? local : regional.length ? regional : board, (d) => d.children);
        const record = {
          id: `NEW${container.value.length + 1}`,
          name,
          consent: v.consent,
          plansPublic: committed && v.announced === "yes",
          country,
          countryId: f.id,
          region: regionOf(f),
          type: v.type,
          lis: {ap: v.ap, cp: v.cp, micro: v.micro, bb: v.bb},
          status: v.status,
          newVendor: committed ? v.newVendor : null,
          goLive: committed ? utc(v.goLive, v.goLive === 2026 ? 10 : 4, 1) : null,
          reason: v.status === "Stable" ? null : v.reason,
          decider: v.status === "Stable" ? null : v.decider,
          informatics: v.informatics,
          direction: v.direction,
          previous: null,
          board: false,
          wave: "Ambassadors",
          submitted: TODAY,
          referrer: ref.id,
          degree: ref.degree + 1,
          children: 0
        };
        container.value = [...container.value, record];
        container.dispatchEvent(new Event("input", {bubbles: true}));
        const countryN = seedResponses.filter((d) => d.countryId === f.id).length + 1;
        const place = countryN >= MIN_CELL ? country : record.region;
        const appearAs = {
          named: `${name} will appear in the atlas by name`,
          unnamed: `Your lab will appear as ${articleFor(v.type).toLowerCase()} ${v.type.toLowerCase()} in ${place}`,
          aggregate: "Your lab will count toward the totals but won't be listed"
        }[v.consent];
        const refLabel = ref.consent === "named" ? `${ref.name} (${ref.country})` : "a colleague's lab";
        const plansNote = v.status === "Evaluating" ? " While you're evaluating, your plans count toward totals only." : committed && v.announced !== "yes" ? " Your plans count toward totals only until you tell us they're announced." : "";
        const code = Math.random().toString(36).slice(2, 7).toUpperCase();
        const link = `https://atlas.example.org/join?ref=${code}`;
        const copy = html`<button type="button">Copy</button>`;
        copy.onclick = () => navigator.clipboard?.writeText(link).then(() => (copy.textContent = "Copied"));
        message.replaceChildren(html`<div class="survey-thanks">
          <p><b>Thank you!</b> ${appearAs}.${plansNote} Scroll up to see ${country} on the <a href="#atlas-coverage">coverage map</a> and your lab in the <a href="#atlas-network">referral network</a>.</p>
          <p>You arrived through a link from <b>${refLabel}</b>, so you are <b>${record.degree} ${record.degree === 1 ? "hop" : "hops"}</b> from the Association board.</p>
          <div class="survey-ref"><span>Your referral link</span><code>${link}</code>${copy}</div>
          <p style="margin-bottom:6px">Forward it to a colleague at another institution. Every lab they bring in becomes part of your branch.</p>
          <div class="survey-share"><button type="button" disabled title="Not wired up in the prototype">Email a colleague</button><button type="button" disabled title="Not wired up in the prototype">Share on LinkedIn</button></div>
        </div>`);
      };
      return container;
    }
  </script>
