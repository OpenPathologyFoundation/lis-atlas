    **An open, crowdsourced world map of anatomic pathology: which AP LIS each operation runs, where it stands with digital pathology, and which bespoke tools its informatics team has built and would share.** Published live on Observable and proposed to the Association.

    <div class="proto-banner"><b>Prototype.</b> Every institution, vendor, tool, response, and number on this page is synthetic, except the US hospital totals, which come from the public CMS hospital list. It shows how the atlas could look about ten weeks after launch, with data as of October 7, 2026. <a href="#atlas-survey"><b>Take the survey</b></a> and watch your operation appear.</div>

    The unit is the **AP operation**: the group that signs out surgical pathology and cytology for one or more sites. It may be a hospital department, an academic department, a contracted pathology group, or an independent or dermatopathology practice. Each one is counted on its own, never as part of the clinical lab that shares its building.

  <script type="text/markdown">
    <a id="atlas-privacy"></a>

    ## How respondents are protected

    Every operation picks one of three consent levels in the survey, and the public view applies three rules on top of them.

    - **Named** (${d3.format(",")(consentCounts.get("named") ?? 0)} operations): name shown with systems, announced plans, and any tools offered for sharing.
    - **Unnamed** (${d3.format(",")(consentCounts.get("unnamed") ?? 0)} operations): systems and plans shown as, say, "a dermatopathology practice in Germany". Where a country has fewer than ${MIN_CELL} responding operations, only the region is given.
    - **Totals only** (${d3.format(",")(consentCounts.get("aggregate") ?? 0)} operations): counted in maps, charts, and totals, but never listed individually.
    - **Plans:** a listed operation's new vendor, go-live date, reason, and decision-maker appear only once it says they're announced or under contract. "Evaluating" is only ever counted in totals, and so are each operation's digital pathology target, main barrier, and informatics staffing.
    - **Bespoke tools:** a tool's name, and what it does, appear only when its operation is shown by name and offers to share it. For every other operation, what the tools do is counted only in totals.
    - **Small-cell suppression:** any number based on fewer than ${MIN_CELL} operations is hidden. Map areas and bar segments are hatched, and counts read "fewer than ${MIN_CELL}". On the US hospital map, operations that asked not to be named count toward their state only once ${MIN_CELL} of them there have answered. ${publicView ? "On the vendor map, that currently hides " + hatchedCountries + " countries." : "The staff view switches this off."}

    Switch **Show as** to *Staff view* at the top of the page to see the raw data these rules protect. In the live atlas, that view would sit behind a staff login.
  </script>
  <script type="text/markdown">
    ## From prototype to live

    - **Survey.** Any form tool that exports CSV or has an API works (REDCap, Qualtrics, Google Forms). The referral link is a URL parameter (`?ref=CODE`) stored with each response.
    - **Finding operations.** In the US, the public CMS list of CLIA-certified labs gives names and sites to suggest in the survey and a denominator for coverage. Other countries need their own lists.
    - **Data.** A scheduled data loader pulls the responses, removes names for operations that opted out, and publishes one cleaned CSV. The charts on this page read that file instead of the synthetic generator built into this notebook.
    - **Governance.** The Association owns the dataset. A small editorial group reviews new vendors and tools and merges duplicate operations, and an open license lets members reuse the data.
  </script>

    function tooltip(container) {
      const tip = document.createElement("div");
      tip.className = "viz-tip";
      container.append(tip);
      return {
        show(event, title, rows = []) {
          const titleEl = document.createElement("div");
          titleEl.className = "tip-title";
          titleEl.textContent = title;
          tip.replaceChildren(titleEl, ...rows.map(([value, label, color]) => {
            const row = document.createElement("div");
            row.className = "tip-row";
            if (color) {
              const key = document.createElement("span");
              key.className = "tip-key";
              key.style.background = color;
              row.append(key);
            }
            const strong = document.createElement("b");
            strong.textContent = value;
            row.append(strong, document.createTextNode(` ${label}`));
            return row;
          }));
          const box = container.getBoundingClientRect();
          const x = event.clientX - box.left;
          const y = event.clientY - box.top;
          const flip = x > box.width - 320;
          tip.style.left = `${flip ? x - 14 - tip.offsetWidth : x + 14}px`;
          tip.style.top = `${Math.max(0, y - 10)}px`;
          tip.style.opacity = 1;
        },
        hide() {
          tip.style.opacity = 0;
        }
      };
    }

    function projectionFor(region) {
      const extent = REGION_EXTENT[region];
      if (!extent) return {type: "equal-earth", domain: land};
      const [[x0, y0], [x1, y1]] = extent;
      return {type: "equal-earth", domain: {type: "MultiPoint", coordinates: [[x0, y0], [x1, y0], [x0, y1], [x1, y1], [(x0 + x1) / 2, y0], [(x0 + x1) / 2, y1]]}, inset: 4};
    }

    function regionOf(feature) {
      const known = COUNTRY_BY_ID.get(feature.id);
      if (known) return known.region;
      const [lon, lat] = d3.geoCentroid(feature);
      for (const region of ["Middle East", "Europe", "Africa", "North America", "Latin America", "Asia-Pacific"]) {
        const [[x0, y0], [x1, y1]] = REGION_EXTENT[region];
        if (lon >= x0 && lon <= x1 && lat >= y0 && lat <= y1) return region;
      }
      return lat > 45 ? "Europe" : "Asia-Pacific";
    }

      // Who referred whom: mostly a colleague in the same country who answered recently (their referral link is fresh),
      // with a pull toward operations that already referred others.
      const RICH = 1.2, BOARD_PULL = 0.6, FRESH_DAYS = 10;

          if (!pool.length) pool = boardRows;

              })),
              Plot.geo(covered.filter((f) => hidden(f)), Plot.centroid({
                fill: `url(#${id})`,
                tip: {format: {x: false, y: false}},
                channels: {Country: (f) => f.properties.name, Status: () => `Hidden: fewer than ${MIN_CELL} operations`}
              })),
              Plot.geo(borders, {stroke: "white", strokeWidth: 0.4})
            ]
          })}
        </div>`;
      });
      return html`<div>
        <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 24px;">${Plot.legend({color: {...color, width: 300}, style: PLOT_STYLE})}${publicView ? swatchLegend([[`Hidden (fewer than ${MIN_CELL} operations)`, HATCH_CSS]]) : ""}</div>
        <div style="display: grid; grid-template-columns: repeat(${cols}, ${w}px); gap: 10px ${gap}px; margin-top: 6px;">${maps}</div>
      </div>`;
    }
  </script>
  <script type="module">
    function installedBase(rows, disc) {
      if (!rows.length) return emptyNote();
      const data = d3.rollups(rows, (v) => v.length, (d) => d.lis[disc])
        .map(([vendor, n]) => ({vendor, n, hidden: suppressed(n)}))
        .sort((a, b) => d3.descending(a.hidden ? 0 : a.n, b.hidden ? 0 : b.n) || d3.ascending(a.vendor, b.vendor));
      return Plot.plot({
        width: Math.min(W, 640),
        height: data.length * 26 + 16,
        marginLeft: 150,
        marginRight: 90,
        marginTop: 8,
        marginBottom: 8,
        style: PLOT_STYLE,
        x: {axis: null},
        y: {domain: data.map((d) => d.vendor), label: null, tickSize: 0},
        color: {domain: GROUPS, range: GROUP_COLORS},
        marks: [
          Plot.barX(data.filter((d) => !d.hidden), {
            x: "n", y: "vendor", fill: (d) => vendorGroup(d.vendor), insetTop: 3, insetBottom: 3, rx2: 4,
            tip: {format: {fill: false, y: false}}, channels: {Vendor: "vendor", Share: (d) => pct(d.n, rows.length)}
          }),
          Plot.text(data, {x: (d) => (d.hidden ? 0 : d.n), y: "vendor", text: (d) => (d.hidden ? `fewer than ${MIN_CELL}` : `${d.n} · ${pct(d.n, rows.length)}`), dx: 6, textAnchor: "start", fill: (d) => (d.hidden ? MUTED : INK2)}),
          Plot.ruleX([0], {stroke: AXIS})
        ]
      });
    }
  </script>
  <script type="module">
    import {sankey as d3Sankey} from "npm:d3-sankey";
  </script>
  <script type="module">
    function migrationSankey(rows, disc) {
      const movers = rows.filter((d) => d.status !== "Stable");
      if (!movers.length) return emptyNote();
      const flows = d3.rollups(movers, (v) => v.length, (d) => d.lis[disc], (d) => d.newVendor ?? UNDECIDED);
      const allLinks = flows.flatMap(([from, tos]) => tos.map(([to, value]) => ({source: `from:${from}`, target: `to:${to}`, value})));
      // Small-cell suppression: leave out moves made by fewer than MIN_CELL operations in the public view.
      const links = allLinks.filter((l) => !suppressed(l.value));
      const hiddenLabs = d3.sum(allLinks, (l) => (suppressed(l.value) ? l.value : 0));
      if (!links.length) return html`<p class="empty-note">Every move in this view involves fewer than ${MIN_CELL} operations, so none are shown.</p>`;
      const ids = [...new Set(links.flatMap((l) => [l.source, l.target]))];
      const nodes = ids.map((id) => ({id, name: id.slice(id.indexOf(":") + 1), side: id.startsWith("from:") ? "from" : "to"}));
      const tallest = Math.max(...["from", "to"].map((side) => nodes.filter((n) => n.side === side).length));
      const w = W;
      const h = Math.max(340, tallest * 40 + 28);
      // On narrow screens the nodes sit at the edges and their labels go inside, over the flows.
      const narrow = W < 560;
      const marginL = narrow ? 2 : 170;
      const marginR = narrow ? 2 : 200;
      const graph = d3Sankey()
        .nodeId((d) => d.id)
        .nodeWidth(12)
        .nodePadding(14)
        .nodeSort((a, b) => (a.name === UNDECIDED) - (b.name === UNDECIDED) || b.value - a.value)
        .extent([[marginL, 28], [w - marginR, h - 8]])({nodes, links});

      const wrap = html`<div class="viz-wrap"></div>`;
      const tip = tooltip(wrap);
      const svg = d3.create("svg").attr("width", w).attr("height", h).attr("viewBox", [0, 0, w, h]).style("max-width", "100%").style("height", "auto").style("font", "12.5px system-ui, -apple-system, 'Segoe UI', sans-serif");
      const path = d3.linkHorizontal().source((d) => [d.source.x1, d.y0]).target((d) => [d.target.x0, d.y1]);
      const link = svg.append("g").attr("fill", "none").selectAll("path").data(graph.links).join("path")
        .attr("d", path)
        .attr("stroke", (d) => vendorColor(d.target.name))
        .attr("stroke-opacity", 0.45)
        .attr("stroke-width", (d) => Math.max(1.5, d.width))
        .on("pointermove", function (event, d) {
          link.attr("stroke-opacity", (l) => (l === d ? 0.85 : 0.18));
          tip.show(event, `${d.source.name} → ${d.target.name}`, [[`${d.value}`, d.value === 1 ? "operation" : "operations", vendorColor(d.target.name)], [pct(d.value, d.source.value), `of operations leaving ${d.source.name}`]]);
        })
        .on("pointerleave", () => {
          link.attr("stroke-opacity", 0.45);
          tip.hide();
        });
      svg.append("g").selectAll("rect").data(graph.nodes).join("rect")
        .attr("x", (d) => d.x0)
        .attr("y", (d) => d.y0)
        .attr("width", (d) => d.x1 - d.x0)
        .attr("height", (d) => Math.max(1, d.y1 - d.y0))
        .attr("rx", 2)
        .attr("fill", (d) => vendorColor(d.name));
      // Inside labels share a row with the opposite side, so each gets at most half the width (about 7.5px per character).
      const maxChars = Math.floor((w / 2 - 24) / 7.5);
      const shortName = (d) => {
        const name = d.name === UNDECIDED ? "Undecided" : d.name;
        return name.length > maxChars ? `${name.slice(0, maxChars - 1).trimEnd()}…` : name;
      };
      const label = svg.append("g").style("pointer-events", "none").selectAll("text").data(graph.nodes).join("text")
        .attr("x", (d) => (d.side === "from" ? (narrow ? d.x1 + 6 : d.x0 - 8) : narrow ? d.x0 - 6 : d.x1 + 8))
        .attr("y", (d) => (d.y0 + d.y1) / 2)
        .attr("dy", "0.35em")
        .attr("text-anchor", (d) => ((d.side === "from") === narrow ? "start" : "end"))
        .attr("stroke", SURFACE).attr("stroke-width", 3).attr("stroke-linejoin", "round").attr("paint-order", "stroke");
      label.append("tspan").attr("fill", INK).text((d) => (narrow ? shortName(d) : d.name));
      if (!narrow) label.append("tspan").attr("fill", INK2).text((d) => `  ${d.value}`);
      svg.append("g").attr("fill", INK2).style("font-weight", 600).style("letter-spacing", "0.05em").selectAll("text")
        .data([["RUNS TODAY", marginL, "start"], ["MOVING TO", w - marginR, "end"]]).join("text")
        .attr("x", (d) => d[1]).attr("y", 12).attr("text-anchor", (d) => d[2]).text((d) => d[0]);
      wrap.append(svg.node());
      if (hiddenLabs) wrap.append(html`<p class="viz-note">${hiddenLabs} more operations are in moves made by fewer than ${MIN_CELL} operations each, which the public view leaves out.</p>`);
      return wrap;
    }
  </script>
  <script type="module">
    // Complementary suppression for the public view. Each line is a list of cells {n, hidden} whose total a reader
    // knows, such as a row or a column. Hiding only the cells under MIN_CELL would let a reader recover one by
    // subtraction, so in every line more cells are hidden, smallest first, until the hidden ones add up to nothing or
    // to at least MIN_CELL. Cells shared between a row and a column are the same objects, so both lines see the change.
    function protectLines(lines) {
      const fix = (line) => {
        const hiddenSum = d3.sum(line, (c) => (c.hidden ? c.n : 0));
        if (!hiddenSum || hiddenSum >= MIN_CELL) return false;
        const next = d3.least(line.filter((c) => !c.hidden && c.n), (c) => c.n);
        if (next) next.hidden = true;
        return Boolean(next);
      };
      for (let changed = true; changed; ) {
        changed = false;
        for (const line of lines) changed = fix(line) || changed;
      }
    }

    // Bars sorted by count, or in the given order for ordered answers. A list-valued field (several answers) counts
    // each answer, as a share of the operations that gave at least one.
    function breakdownChart(rows, key, title, order) {
      const movers = rows.filter((d) => (Array.isArray(d[key]) ? d[key].length : d[key]));
      if (!movers.length) return emptyNote();
      const several = movers.some((d) => Array.isArray(d[key]));
      const answers = movers.flatMap((d) => (several ? d[key] : [d[key]]));
      const data = d3.rollups(answers, (v) => v.length, (v) => v)
        .map(([label, n]) => ({label, n, small: suppressed(n), hidden: suppressed(n)}));
      // With one answer per operation the bars add up to a known total, so one hidden bar could be worked out.
      if (publicView && !several) protectLines([data]);
      data.sort(order
        ? (a, b) => order.indexOf(a.label) - order.indexOf(b.label)
        : (a, b) => d3.descending(a.hidden ? 0 : a.n, b.hidden ? 0 : b.n) || d3.ascending(a.label, b.label));
      const narrow = W < 560;
      return Plot.plot({
        width: Math.min(W, 640),
        height: data.length * (narrow ? 44 : 28) + 16,
        marginLeft: narrow ? 0 : 230,
        marginRight: 90,
        marginTop: 8,
        marginBottom: 8,
        style: PLOT_STYLE,
        x: {axis: null, domain: [0, d3.max(data, (d) => (d.hidden ? 0 : d.n)) || 1]},
        y: {domain: data.map((d) => d.label), label: null, tickSize: 0, axis: narrow ? null : "left"},
        marks: [
          narrow ? Plot.text(data, {x: 0, y: "label", text: "label", dy: -11, textAnchor: "start", fill: INK2}) : null,
          Plot.barX(data.filter((d) => !d.hidden), {x: "n", y: "label", fill: GROUP_COLORS[0], insetTop: narrow ? 20 : 4, insetBottom: 4, rx2: 4, tip: {format: {y: false}}, channels: {[title]: "label"}}),
          Plot.text(data, {x: (d) => (d.hidden ? 0 : d.n), y: "label", text: (d) => (d.small ? `fewer than ${MIN_CELL}` : d.hidden ? "hidden" : `${d.n} · ${pct(d.n, movers.length)}`), dx: 6, dy: narrow ? 8 : 0, textAnchor: "start", fill: (d) => (d.hidden ? MUTED : INK2)}),
          Plot.ruleX([0], {stroke: AXIS})
        ]
      });
    }

    // Consolidation versus everything else: how often pathology wasn't part of the decision.
    function decisionNote(rows) {
      const movers = rows.filter((d) => d.decider);
      const share = (v) => ({n: v.length, outside: v.filter((d) => !PATHOLOGY_AT_TABLE.includes(d.decider)).length});
      const consolidation = share(movers.filter((d) => CONSOLIDATION_REASONS.includes(d.reason)));
      const rest = share(movers.filter((d) => !CONSOLIDATION_REASONS.includes(d.reason)));
      if (consolidation.n < MIN_CELL || rest.n < MIN_CELL) return "";
      return html`<p class="viz-note">When consolidation (EHR or merger) drove the move, ${pct(consolidation.outside, consolidation.n)} of decisions were made without pathology leadership at the table. For every other reason, ${pct(rest.outside, rest.n)} were. <b>Illustrative pattern, not a finding:</b> the synthetic data was built to show this.</p>`;
    }

    // The share of operations meeting `test` in each informatics staffing band. The public view gives shares only, since
    // band sizes would reveal staffing, which is counted only in totals.
    function teamChart(rows, test, what) {
      const data = STAFF_BANDS.map((team) => {
        const ops = rows.filter((d) => d.staff === team);
        const n = ops.filter(test).length;
        return {team, total: ops.length, n, share: ops.length ? n / ops.length : 0, hidden: suppressed(ops.length) || suppressed(n) || suppressed(ops.length - n)};
      }).filter((d) => d.total);
      if (!data.length) return emptyNote();
      const narrow = W < 560;
      const label = (d) => (d.hidden ? "hidden (small group)" : publicView ? pct(d.n, d.total) : `${pct(d.n, d.total)} of ${d.total} operations`);
      return Plot.plot({
        width: Math.min(W, 640),
        height: data.length * (narrow ? 44 : 28) + 16,
        marginLeft: narrow ? 0 : 130,
        marginRight: 160,
        marginTop: 8,
        marginBottom: 8,
        style: PLOT_STYLE,
        x: {axis: null, domain: [0, d3.max(data, (d) => (d.hidden ? 0 : d.share)) || 1]},
        y: {domain: data.map((d) => d.team), label: null, tickSize: 0, axis: narrow ? null : "left"},
        marks: [
          narrow ? Plot.text(data, {x: 0, y: "team", text: "team", dy: -11, textAnchor: "start", fill: INK2}) : null,
          Plot.barX(data.filter((d) => !d.hidden), {x: "share", y: "team", fill: GROUP_COLORS[0], insetTop: narrow ? 20 : 4, insetBottom: 4, rx2: 4, tip: {format: {x: false, y: false}}, channels: {"Informatics staff": "team", [what]: label}}),
          Plot.text(data, {x: (d) => (d.hidden ? 0 : d.share), y: "team", text: label, dx: 6, dy: narrow ? 8 : 0, textAnchor: "start", fill: (d) => (d.hidden ? MUTED : INK2)}),
          Plot.ruleX([0], {stroke: AXIS})
        ]
      });
    }

    // Where each type of operation stands with digital pathology. In the public view, small stage counts are pooled into
    // one hatched segment per bar, with complementary suppression across both the bars (types) and the stages, so no
    // count under MIN_CELL can be read off a bar or worked out from the "All operations" bar or the other types.
    function dpStatusChart(rows) {
      if (!rows.length) return emptyNote();
      const cellsFor = (group, list) => DP_STATUSES.map((status) => {
        const n = list.filter((d) => d.dp === status).length;
        return {group, status, n, total: list.length, hidden: suppressed(n) || suppressed(list.length)};
      });
      const typeRows = TYPES.map((t) => cellsFor(t, rows.filter((d) => d.type === t))).filter((row) => row[0].total);
      const allRow = cellsFor("All operations", rows);
      // The page also prints how many operations sign out digitally and how many are primary digital, so the two
      // clinical stages form a line of their own in every bar.
      const clinical = (row) => row.filter((c) => DP_CLINICAL.includes(c.status));
      if (publicView) {
        protectLines([...typeRows, ...typeRows.map(clinical), ...DP_STATUSES.map((_, j) => typeRows.map((row) => row[j]))]);
        protectLines([allRow, clinical(allRow)]);
      }
      const shownTypes = typeRows.filter((row) => !suppressed(row[0].total));
      const shown = typeRows.length > 1 && !suppressed(rows.length) ? [allRow, ...shownTypes] : shownTypes;
      if (!shown.length) return html`<p class="empty-note">Fewer than ${MIN_CELL} operations of each type match these filters, so stages aren't shown.</p>`;
      const pooled = `Pooled to hide stages under ${MIN_CELL} operations`;
      // The pooled segment sits where its lowest stage would, so it never reads as the most digital part of a bar.
      const data = shown.flatMap((row) => {
        const first = row.findIndex((c) => c.hidden && c.n);
        const hiddenN = d3.sum(row, (c) => (c.hidden ? c.n : 0));
        const segments = row.flatMap((c, i) => [
          ...(i === first ? [{group: c.group, status: pooled, n: hiddenN, total: c.total}] : []),
          ...(c.n && !c.hidden ? [c] : [])
        ]);
        let x = 0;
        return segments.map((d) => ({...d, x1: x, x2: (x += d.n / d.total)}));
      });
      const groups = shown.map((row) => row[0].group);
      const narrow = W < 560;
      const width = Math.min(W, 720);
      const marginLeft = narrow ? 0 : 190;
      const plotW = width - marginLeft - 10;
      const id = hatchId();
      const visible = data.filter((d) => d.status !== pooled);
      const darkStage = (status) => DP_STATUSES.indexOf(status) >= 4;
      const plot = Plot.plot({
        width,
        height: groups.length * (narrow ? 46 : 32) + 12,
        marginLeft,
        marginRight: 10,
        marginTop: 4,
        marginBottom: 8,
        style: PLOT_STYLE,
        x: {axis: null, domain: [0, 1]},
        y: {domain: groups, label: null, tickSize: 0, axis: narrow ? null : "left"},
        marks: [
          hatchDefs(id),
          narrow ? Plot.text(groups.map((group) => ({group})), {x: 0, y: "group", text: "group", dy: -12, textAnchor: "start", fill: INK2}) : null,
          Plot.barX(visible, {x1: "x1", x2: "x2", y: "group", fill: (d) => DP_COLORS[DP_STATUSES.indexOf(d.status)], insetTop: narrow ? 22 : 5, insetBottom: 5, stroke: SURFACE, strokeWidth: 1,
            tip: {format: {x1: false, x2: false, y: false, fill: false}}, channels: {Operations: "group", Stage: "status", Count: (d) => `${d.n} of ${d.total} (${pct(d.n, d.total)})`}}),
          Plot.barX(data.filter((d) => d.status === pooled), {x1: "x1", x2: "x2", y: "group", fill: `url(#${id})`, insetTop: narrow ? 22 : 5, insetBottom: 5, stroke: SURFACE, strokeWidth: 1,
            tip: {format: {x1: false, x2: false, y: false}}, channels: {Operations: "group", Stage: () => pooled}}),
          Plot.text(visible.filter((d) => (d.x2 - d.x1) * plotW >= 34), {x: (d) => (d.x1 + d.x2) / 2, y: "group", text: (d) => pct(d.n, d.total), fill: (d) => (darkStage(d.status) ? SURFACE : INK), dy: narrow ? 9 : 0, fontSize: 11})
        ]
      });
      const legend = swatchLegend([...DP_STATUSES.map((status, i) => [status, DP_COLORS[i]]), ...(data.some((d) => d.status === pooled) ? [[pooled, HATCH_CSS]] : [])]);
      const left = typeRows.length - shownTypes.length;
      return html`<div>${legend}${plot}${left ? html`<p class="viz-note">${left} operation ${left === 1 ? "type has" : "types have"} fewer than ${MIN_CELL} operations in this view and ${left === 1 ? "is" : "are"} left out.</p>` : ""}</div>`;
    }

    // The library of bespoke tools on offer: named operations that would share, or already do.
    function toolsOnOffer(rows) {
      const tools = rows
        .filter((d) => SHARING.includes(d.share) && (!publicView || d.consent === "named"))
        .flatMap((d) => d.tools.map((t) => ({
          Tool: t.name,
          "What it does": t.area,
          Operation: d.name,
          Country: d.country,
          Support: d.support ?? "",
          Sharing: d.share === "Already shared" ? "Already shared" : "Open to sharing"
        })))
        .sort((a, b) => BESPOKE_AREAS.indexOf(a["What it does"]) - BESPOKE_AREAS.indexOf(b["What it does"]) || d3.ascending(a.Tool, b.Tool));
      if (!tools.length) return html`<p class="empty-note">No tools on offer match these filters yet.</p>`;
      const operations = new Set(tools.map((t) => t.Operation)).size;
      return html`<div><p class="viz-note">${tools.length} tools from ${operations} operations.</p>${Inputs.table(tools, {rows: 12, layout: "auto"})}</div>`;
    }

    // The share of operations that would be primary digital each year if every stated target held. The public view
    // shows a year only when its running total and the step from the last year shown each cover none or at least
    // MIN_CELL operations, so no small group of target years can be read off the line.
    function dpTargetChart(rows) {
      if (!rows.length) return emptyNote();
      const tooFew = html`<p class="empty-note">Too few operations match these filters to show the projection.</p>`;
      if (suppressed(rows.length)) return tooFew;
      const years = d3.range(2026, 2032);
      let data = years.map((year) => ({year, n: rows.filter((d) => d.dp === "Primary digital" || (+d.dpTarget && +d.dpTarget <= year)).length}));
      if (publicView) {
        const kept = [];
        for (const d of data) if (!suppressed(d.n) && !suppressed(d.n - (kept.at(-1)?.n ?? 0))) kept.push(d);
        while (kept.length && suppressed(rows.length - kept.at(-1).n)) kept.pop();
        data = kept;
      }
      if (!data.length) return tooFew;
      const label = (d) => pct(d.n, rows.length);
      const yearLabel = (y) => (y === 2026 ? "Today" : String(y));
      const narrow = W < 560;
      const plot = Plot.plot({
        width: Math.min(W, 640),
        height: 220,
        marginLeft: 40,
        marginRight: 24,
        marginTop: 22,
        marginBottom: 30,
        style: PLOT_STYLE,
        x: {domain: [2026, 2031], label: null, ticks: narrow ? [2026, 2028, 2030] : years, tickFormat: yearLabel},
        y: {domain: [0, Math.min(1, Math.max(0.1, (d3.max(data, (d) => d.n) / rows.length) * 1.2))], grid: true, tickFormat: "%", label: null},
        marks: [
          Plot.ruleY([0], {stroke: AXIS}),
          Plot.lineY(data, {x: "year", y: (d) => d.n / rows.length, stroke: GROUP_COLORS[0], strokeWidth: 2, strokeDasharray: "5,4"}),
          Plot.dot(data, {x: "year", y: (d) => d.n / rows.length, fill: (d) => (d.year === 2026 ? GROUP_COLORS[0] : SURFACE), stroke: GROUP_COLORS[0], strokeWidth: 2, r: 4,
            tip: {format: {x: false, y: false, fill: false}}, channels: {Year: (d) => yearLabel(d.year), "Primary digital": label}}),
          Plot.text(data, {x: "year", y: (d) => d.n / rows.length, text: label, dy: -12, fill: INK2, fontSize: 11})
        ]
      });
      const merged = data.length < years.length;
      return html`<div>${plot}${merged ? html`<p class="viz-note">Years with fewer than ${MIN_CELL} operations reaching their target are merged into the next year shown.</p>` : ""}</div>`;
    }
  </script>
  <script type="module">
    function goLiveTimeline(rows, disc) {
      const live = rows
        .filter((d) => d.goLive && d.goLive >= utc(2026, 10, 1) && listable(d) && planShown(d))
        .map((d) => ({...d, x: new Date(+d.goLive + 45 * 864e5), group: vendorGroup(d.newVendor), from: d.lis[disc], quarter: quarterLabel(d.goLive), lab: labelOf(d), place: placeOf(d)}));
      if (!live.length) return emptyNote();
      const tallest = d3.max(d3.rollup(live, (v) => v.length, (d) => +d.goLive).values());
      const step = 11;
      return Plot.plot({
        width: W,
        height: step * (tallest + 0.6) + 66,
        marginTop: 16,
        marginBottom: 30,
        style: PLOT_STYLE,
        x: {type: "utc", domain: [utc(2026, 10, 1), utc(2031, 1, 1)], label: null, ticks: d3.utcYear.every(1), tickFormat: "%Y", tickSize: 0},
        y: {axis: null, domain: [0, tallest + 0.6]},
        color: {domain: GROUPS, range: GROUP_COLORS, legend: true},
        marks: [
          Plot.ruleX(d3.utcYears(utc(2027, 1, 1), utc(2031, 1, 1)), {stroke: GRID}),
          Plot.ruleY([0], {stroke: AXIS}),
          Plot.dot(live, Plot.stackY2({
            x: "x", fill: "group", order: GROUPS, r: 4.5, stroke: SURFACE, strokeWidth: 1,
            tip: {format: {x: false, y: false, fill: false}},
            channels: {Operation: "lab", Where: "place", From: "from", To: "newVendor", "Go-live": "quarter", Status: "status"}
          }))
        ]
      });
    }
  </script>
  <script type="module">
    function shareOverTime(rows, disc) {
      if (!rows.length) return emptyNote();

        const counts = d3.rollup(rows, (v) => v.length, (d) => vendorGroup(vendorAt(d, date)));
        return TRACKED.map((group) => ({date, group, share: (counts.get(group) ?? 0) / rows.length}));

          Plot.line(future, {x: "date", y: "share", stroke: "group", strokeWidth: 2, strokeDasharray: "5,4", curve: "monotone-x"}),
          Plot.dot(ends, {x: "date", y: "share", fill: "group", r: 4, stroke: SURFACE, strokeWidth: 2}),

  <script type="module">
    function referralNetwork({nodes, links, byId}, visible) {
      const w = W;
      const h = Math.round(Math.min(640, Math.max(420, w * 0.6)));
      const [x0, x1] = d3.extent(nodes, (n) => n.x);
      const [y0, y1] = d3.extent(nodes, (n) => n.y);
      const k = Math.min((w - 60) / (x1 - x0 || 1), (h - 60) / (y1 - y0 || 1));
      const sx = (x) => w / 2 + (x - (x0 + x1) / 2) * k;
      const sy = (y) => h / 2 + (y - (y0 + y1) / 2) * k;
      const rOf = (n) => Math.max(2.2, n.r * Math.min(k, 1.6));
      const isVisible = (n) => !n.d || visible.has(n.id);
      const fillOf = (n) => (n.d ? DEGREE_COLORS[degreeBin(n.d.degree)] : INK);
      const chainOf = (n) => {
        const chain = [];
        for (let cur = n; cur; cur = cur.d?.referrer ? byId.get(cur.d.referrer) : cur.d ? byId.get("ASSOC") : null) chain.push(cur);
        return chain;

      const wrap = html`<div class="viz-wrap"></div>`;
      const tip = tooltip(wrap);

      const link = svg.append("g").attr("stroke", AXIS).attr("stroke-width", 0.8).selectAll("line").data(links).join("line")
        .attr("x1", (l) => sx(l.source.x)).attr("y1", (l) => sy(l.source.y))
        .attr("x2", (l) => sx(l.target.x)).attr("y2", (l) => sy(l.target.y))
        .attr("stroke-opacity", (l) => (visible.has(l.target.id) ? 0.9 : 0.25));
      const node = svg.append("g").selectAll("circle").data(nodes).join("circle")
        .attr("cx", (n) => sx(n.x)).attr("cy", (n) => sy(n.y)).attr("r", rOf)
        .attr("fill", fillOf)
        .attr("stroke", (n) => (n.d?.board ? INK : SURFACE))
        .attr("stroke-width", (n) => (n.d?.board ? 1.5 : 0.8))
        .attr("opacity", (n) => (isVisible(n) ? 1 : 0.15));
      const hub = byId.get("ASSOC");
      const labelled = [hub, ...nodes.filter((n) => n.d && visible.has(n.id) && (!publicView || n.d.consent === "named") && !n.d.board).sort((a, b) => b.children - a.children).slice(0, W < 800 ? 0 : 3)];
      // Put a label on the left of its node when it would run past the right edge (about 6.6px per character at 12px).
      const fitsRight = (n) => sx(n.x) + rOf(n) + 4 + (n.d ? n.d.name : "The Association").length * 6.6 <= w;
      svg.append("g").selectAll("text").data(labelled).join("text")
        .attr("x", (n) => (fitsRight(n) ? sx(n.x) + rOf(n) + 4 : sx(n.x) - rOf(n) - 4)).attr("y", (n) => sy(n.y)).attr("dy", "0.35em")

        const chain = chainOf(n);
        const onChain = new Set(chain.map((c) => c.id));

        link.attr("stroke-opacity", (l) => (onChain.has(l.target.id) && onChain.has(l.source.id) ? 1 : 0.08)).attr("stroke", (l) => (onChain.has(l.target.id) && onChain.has(l.source.id) ? INK : AXIS));
        if (!n.d) return tip.show(event, "The Association", [[`${board.length}`, "board members seeded the survey"]]);
        // The referral chain from the board down to this operation, shortened in the middle when long.
        const stepLabel = (d) => `${labelOf(d)}${!publicView || d.consent === "named" ? `, ${d.country}` : ""}${d.board ? " (board)" : ""}`;
        const steps = chain.slice().reverse().filter((c) => c.d).map((c, i) => [`${i}`, stepLabel(c.d)]);
        const shown = steps.length > 6 ? [...steps.slice(0, 2), ["…", `${steps.length - 4} more operations`], ...steps.slice(-2)] : steps;
        tip.show(event, labelOf(n.d), [
          [`${n.d.degree}`, n.d.degree === 1 ? "hop from the board" : "hops from the board", fillOf(n)],

  <script type="module">
    // Hospitals signed out for by responding US operations, in the order they answered. A state's coverage is capped at

    // Hospitals are never hidden; the rule protects respondents. In the public view, operations that agreed to be named
    // count right away. Those that asked not to be named count once five of them in the same state have answered, so a
    // state's coverage can't single one out (a group serving 20 hospitals may be the only one that size in its state).
    function usHospitalCoverage(rows) {
      const responding = rows.filter((d) => d.usState && d.hospitals);
      const unnamedIn = d3.rollup(responding.filter((d) => d.consent !== "named"), (v) => v.length, (d) => d.usState);
      const ops = responding.filter((d) => !publicView || d.consent === "named" || unnamedIn.get(d.usState) >= MIN_CELL)
        .sort((a, b) => a.submitted - b.submitted);
      const states = new Map(Object.entries(US_STATES).map(([abbr, [fips, name, ...total]]) => [abbr, {abbr, fips, name, total, covered: [0, 0, 0], ops: 0}]));
      const typeOps = US_HOSPITAL_TYPES.map(() => 0);
      const timeline = [];
      let covered = 0, bigOps = 0, bigHospitals = 0;
      for (const d of ops) {
        const st = states.get(d.usState);
        st.ops += 1;
        let added = 0;
        d.hospitals.forEach((n, i) => {
          const take = Math.min(n, st.total[i] - st.covered[i]);
          st.covered[i] += take;
          added += take;
          if (n) typeOps[i] += 1;

        covered += added;

        ops, states, timeline, covered, typeOps,
        total: d3.sum(all, (st) => d3.sum(st.total)),
        coveredByType: [0, 1, 2].map((i) => d3.sum(all, (st) => st.covered[i])),

        .map((d) => ({...d, share: d.covered / d.total}));

        for (const d of data.slice(1)) if (!suppressed(d.ops - kept.at(-1).ops)) kept.push(d);
        data = kept;
      }
      const yMax = (d3.max(data, (d) => d.covered) || 1) * 1.15;
      return Plot.plot({
        width: Math.min(W / 2 - 20, 520) < 300 ? Math.min(W, 520) : Math.min(W / 2 - 20, 520),
        height: 230,
        marginTop: 26,
        style: PLOT_STYLE,
        x: {type: "utc", label: null, domain: [utc(2026, 8, 3), TODAY], ticks: d3.utcWeek.every(2), tickFormat: "%b %-d"},
        y: {domain: [0, yMax], grid: true, label: null},
        marks: [
          Plot.rect(PHASES, {x1: "start", x2: (d) => (d.end > TODAY ? TODAY : d.end), fill: (d, i) => (i % 2 ? "#f4f3ef" : "#ecebe6"), fillOpacity: 0.8}),
          Plot.text(PHASES, {x: (d) => new Date((+d.start + Math.min(+d.end, +TODAY)) / 2), frameAnchor: "top", dy: -16, text: "name", fill: INK2, fontWeight: 600}),
          Plot.lineY(data, {x: "date", y: "covered", stroke: GROUP_COLORS[0], strokeWidth: 2, curve: "step-after"}),
          Plot.dot(data, {x: "date", y: "covered", fill: SURFACE, stroke: GROUP_COLORS[0], strokeWidth: 2, r: 3.5,
            tip: {format: {x: false, y: false}}, channels: {Date: (d) => d3.utcFormat("%b %-d")(d.date), "Hospitals covered": "covered", "US operations responding": "ops"}})
        ]
      });
    }
  </script>
  <script type="module">
    function surveyForm() {
      const usa = countryFeatures.find((f) => f.id === "840");
      const CLINICAL_CHOICES = ["Yes", "No", "No clinical lab at our sites"];
      const inputs = {
        institution: Inputs.text({label: "Name of your AP operation", placeholder: "e.g., Larkmoor University Department of Pathology", width: 320}),
        country: Inputs.select(countryFeatures, {label: "Country", format: (f) => f.properties.name, value: usa}),
        usState: Inputs.select(Object.keys(US_STATES).sort((a, b) => d3.ascending(US_STATES[a][1], US_STATES[b][1])), {label: "State", format: (k) => US_STATES[k][1], value: "CT"}),
        type: Inputs.select(TYPES, {label: "Kind of operation"}),
        sites: Inputs.select(SITES, {label: "Sites you sign out for", value: "2–5"}),
        cases: Inputs.select(CASE_BANDS, {label: "Surgical cases a year", value: "15,000–40,000"}),
        ap: Inputs.select(VENDORS, {label: "AP LIS", value: "Cassandra Health"}),
        sameVendor: Inputs.radio(CLINICAL_CHOICES, {label: "Clinical lab on the same vendor?", value: "No"}),
        status: Inputs.radio(STATUSES, {label: "Changing your AP LIS?", format: (k) => (k === "Stable" ? "Not planning to" : k), value: "Implementing"}),
        newVendor: Inputs.select(VENDORS, {label: "New AP LIS", value: "Sirius Cybernetics"}),
        goLive: Inputs.select([2026, 2027, 2028, 2029, 2030], {label: "Go-live year", value: 2027, format: String}),
        announced: Inputs.radio(["yes", "no"], {label: "Are these plans public?", format: (k) => (k === "yes" ? "Yes: announced or under contract" : "Not yet: count them in totals only"), value: "yes"}),
        reason: Inputs.select(REASONS, {label: "Main reason"}),
        decider: Inputs.select(DECIDERS, {label: "Who decides"}),
        dp: Inputs.select(DP_STATUSES, {label: "Where are you with digital pathology?", value: "Part of clinical sign-out"}),
        scanned: Inputs.select(SCANNED_SHARES, {label: "Share of surgical cases scanned", value: "10–50%"}),
        dpTarget: Inputs.select(DP_TARGETS, {label: "Target year for primary digital", value: "2028"}),
        barrier: Inputs.select(BARRIERS, {label: "Main barrier"}),
        bespoke: Inputs.radio(BESPOKE_STATUSES, {label: "Do you run bespoke tools alongside the AP LIS?", value: BESPOKE_STATUSES[0]}),
        areas: Inputs.checkbox(BESPOKE_AREAS, {label: "What do they do?", value: ["Case assignment and workload"]}),
        share: Inputs.radio(SHARE_CHOICES, {label: "Would you share any of them?", value: "Yes"}),
        toolName: Inputs.text({label: "Name of one tool (optional)", placeholder: "e.g., Case Router", width: 320}),
        support: Inputs.select(SUPPORT_LEVELS, {label: "How is it supported?"}),
        staff: Inputs.select(STAFF_BANDS, {label: "Informatics and LIS staff supporting AP", value: "1–2 FTE"}),
        consent: Inputs.radio(CONSENT_LEVELS, {label: "How to show us", format: (k) => CONSENT_CHOICES[k], value: "named"})
      };
      const form = Inputs.form(inputs, {
        template: (i) => html`<div>
          <div class="survey-step"><span class="step-n">1</span><div><h4>Your AP operation</h4>${i.institution}${i.country}${i.usState}${i.type}${i.sites}${i.cases}${i.staff}</div></div>
          <div class="survey-step"><span class="step-n">2</span><div><h4>AP LIS</h4>${i.ap}${i.sameVendor}${i.status}${i.newVendor}${i.goLive}${i.announced}${i.reason}${i.decider}</div></div>
          <div class="survey-step"><span class="step-n">3</span><div><h4>Digital pathology</h4>${i.dp}${i.scanned}${i.dpTarget}${i.barrier}</div></div>
          <div class="survey-step"><span class="step-n">4</span><div><h4>Bespoke technology</h4>${i.bespoke}${i.areas}${i.share}${i.toolName}${i.support}</div></div>
          <div class="survey-step"><span class="step-n">5</span><div><h4>Visibility</h4>${i.consent}</div></div>
        </div>`
      });
      const show = (input, on) => (input.style.display = on ? "" : "none");
      const sync = () => {
        const s = inputs.status.value;
        const committed = s === "Selected" || s === "Implementing";
        for (const k of ["newVendor", "goLive", "announced"]) show(inputs[k], committed);
        for (const k of ["reason", "decider"]) show(inputs[k], s !== "Stable");
        const dp = inputs.dp.value;
        show(inputs.scanned, DP_CLINICAL.includes(dp));
        show(inputs.dpTarget, dp !== "Primary digital");
        const builds = inputs.bespoke.value !== "No";
        for (const k of ["areas", "share", "support"]) show(inputs[k], builds);
        show(inputs.usState, inputs.country.value?.id === "840");
        show(inputs.toolName, builds && SHARING.includes(inputs.share.value));
      };
      // Keep keystrokes in the form from re-running the charts; only Submit does that.
      form.addEventListener("input", (event) => {
        sync();
        event.stopPropagation();
      });
      sync();

      const message = html`<div aria-live="polite"></div>`;
      const button = html`<button class="survey-submit" type="button">Submit response</button>`;
      const container = html`<div class="survey">${form}<div class="survey-actions">${button}<span class="survey-time">Under 5 minutes. Demo only: nothing leaves this page.</span></div>${message}</div>`;
      container.value = [];
      button.onclick = () => {
        const v = form.value;
        const name = v.institution.trim();
        if (!name) {
          message.replaceChildren(html`<p class="survey-error">Please enter the name of your AP operation.</p>`);
          return;
        }
        const f = v.country;
        const country = COUNTRY_BY_ID.get(f.id)?.name ?? f.properties.name;
        const committed = v.status === "Selected" || v.status === "Implementing";
        // Simulate arriving through the busiest referrer nearby: same country, else same region.
        const nearby = (test) => seedResponses.filter((d) => !d.board && test(d));
        const local = nearby((d) => d.countryId === f.id);
        const regional = nearby((d) => d.region === regionOf(f));
        const ref = d3.greatest(local.length ? local : regional.length ? regional : board, (d) => d.children);
        const builds = v.bespoke !== "No";
        if (builds && !v.areas.length) {
          message.replaceChildren(html`<p class="survey-error">Please tick at least one thing your bespoke tools do.</p>`);
          return;
        }
        const areas = builds ? v.areas : [];
        const share = builds ? v.share : null;
        const toolName = v.toolName.trim();
        // In the live survey a US operation picks its hospitals from the CMS list; the demo estimates them from the site count.
        const usState = f.id === "840" ? v.usState : null;
        const siteCount = {"1": 1, "2–5": 3, "6–20": 12, "More than 20": 25}[v.sites];
        const hospitalCount = v.type === "Dermatopathology practice" ? 0 : v.type === "Independent AP lab" ? Math.round(siteCount * 0.3) : siteCount;
        const cah = v.type === "Contracted pathology group" ? Math.round(hospitalCount * 0.3) : 0;
        const record = {
          id: `NEW${container.value.length + 1}`,
          name,
          consent: v.consent,
          plansPublic: committed && v.announced === "yes",
          country,
          countryId: f.id,
          region: regionOf(f),
          type: v.type,
          lis: {ap: v.ap, cp: v.sameVendor === "Yes" ? v.ap : v.sameVendor === "No" ? "Another vendor" : null},
          status: v.status,
          newVendor: committed ? v.newVendor : null,
          goLive: committed ? utc(v.goLive, v.goLive === 2026 ? 10 : 4, 1) : null,
          reason: v.status === "Stable" ? null : v.reason,
          decider: v.status === "Stable" ? null : v.decider,
          previous: null,
          board: false,
          staff: v.staff,
          sites: v.sites,
          cases: v.cases,
          dp: v.dp,
          scanned: DP_CLINICAL.includes(v.dp) ? v.scanned : null,
          dpTarget: v.dp === "Primary digital" ? "Already there" : v.dpTarget,
          barrier: v.barrier,
          ims: null,
          integration: null,
          ai: [],
          bespoke: v.bespoke,
          bespokeAreas: areas,
          share,
          support: builds ? v.support : null,
          tools: SHARING.includes(share) && toolName ? [{name: toolName, area: areas[0]}] : [],
          usState,
          hospitals: usState ? [hospitalCount - cah, cah, 0] : null,
          wave: "Ambassadors",
          submitted: TODAY,
          referrer: ref.id,
          degree: ref.degree + 1,
          children: 0
        };
        container.value = [...container.value, record];
        container.dispatchEvent(new Event("input", {bubbles: true}));
        const countryN = seedResponses.filter((d) => d.countryId === f.id).length + 1;
        const place = countryN >= MIN_CELL ? country : record.region;
        const appearAs = {
          named: `${name} will appear in the atlas by name`,
          unnamed: `Your operation will appear as ${articleFor(v.type).toLowerCase()} ${lowerFirst(v.type)} in ${place}`,
          aggregate: "Your operation will count toward the totals but won't be listed"
        }[v.consent];
        const refLabel = ref.consent === "named" ? `${ref.name} (${ref.country})` : "a colleague's operation";
        const plansNote = v.status === "Evaluating" ? " While you're evaluating, your plans count toward totals only." : committed && v.announced !== "yes" ? " Your plans count toward totals only until you tell us they're announced." : "";
        const hospitalNote = usState && hospitalCount ? html`<span> The hospitals you sign out for in ${US_STATES[usState][1]} now count toward <a href="#atlas-hospitals">US hospital coverage</a>.</span>` : "";
        const toolNote = record.tools.length ? (v.consent === "named" ? html`<span> ${toolName} is now in the <a href="#atlas-bespoke">tools on offer</a>.</span>` : " Your tool counts in the totals; it is listed by name only when your operation is.") : "";
        const code = Math.random().toString(36).slice(2, 7).toUpperCase();
        const link = `https://atlas.example.org/join?ref=${code}`;
        const copy = html`<button type="button">Copy</button>`;
        copy.onclick = () => navigator.clipboard?.writeText(link).then(() => (copy.textContent = "Copied"));
        message.replaceChildren(html`<div class="survey-thanks">
          <p><b>Thank you!</b> ${appearAs}.${plansNote}${toolNote}${hospitalNote} Scroll up to see ${country} on the <a href="#atlas-coverage">coverage map</a> and your operation in the <a href="#atlas-network">referral network</a>.</p>
          <p>You arrived through a link from <b>${refLabel}</b>, so you are <b>${record.degree} ${record.degree === 1 ? "hop" : "hops"}</b> from the Association board.</p>
          <div class="survey-ref"><span>Your referral link</span><code>${link}</code>${copy}</div>
          <p style="margin-bottom:6px">Forward it to a colleague at another institution. Every operation they bring in becomes part of your branch.</p>
          <div class="survey-share"><button type="button" disabled title="Not wired up in the prototype">Email a colleague</button><button type="button" disabled title="Not wired up in the prototype">Share on LinkedIn</button></div>
        </div>`);
      };
      return container;
    }
  </script>
